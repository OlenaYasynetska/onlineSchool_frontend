@if (pdfSrc) {
  <div class="h-full min-h-[420px] w-full min-w-0">
    <ngx-extended-pdf-viewer
      [src]="pdfSrc"
      height="100%"
      backgroundColor="#262626"
      pdfBackgroundColor="#f4f4f5"
      [pageViewMode]="'book'"
      [theme]="'dark'"
      [language]="'uk'"
      [textLayer]="true"
      [disableForms]="true"
      [showEditorButtons]="false"
      [showOpenFileButton]="false"
      [showPrintButton]="false"
      [showDownloadButton]="allowDownload"
      [filenameForDownload]="downloadFileName"
      [showSecondaryToolbarButton]="false"
      [sidebarVisible]="false"
      [showPresentationModeButton]="true"
      [showHandToolButton]="true"
      [showSidebarButton]="true"
      [showFindButton]="true"
      [enableFlipByDrag]="true"
      [showPageCorners]="true"
      [showMovePageButton]="false"
      class="block h-full w-full min-w-0"
    />
  </div>
}
